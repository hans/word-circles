[project]
name = "word-circles"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "concept-analysis",
    "numpy>=2.4.6",
    "praat-textgrids>=1.4",
    "pyyaml>=6",
    "snakemake>=9",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "tqdm>=4.66",
    "transformers>=5.20.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/word_circles"]

[tool.uv.sources]
concept-analysis = { git = "https://github.com/burin-n/word_timing_trajectory", rev = "e36e7e684ba7c7b43f349420006ebfd3ef0e2a9e" }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs fetched data under data/ (run the fetch rules first)"]
